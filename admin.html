<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>太鼓スコア記録 管理者</title>
<link rel="stylesheet" href="style.css">
<style>
  main{padding-bottom:40px}
  .evrow{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;border:1.5px solid var(--cc,var(--line));border-radius:16px;padding:2px 4px 2px 10px;margin:3px 4px 0 0}
  .chip b{color:var(--cc)}
  .chip button{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;padding:0 4px}
  .rk{font-weight:800;width:36px}
  .rk1{color:#d4a017}.rk2{color:#8f9aa6}.rk3{color:#b9733a}
  .cfg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
  .raw{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .snapnote{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
  .kv span:nth-child(odd){color:var(--muted)}
</style>
</head>
<body>
<header><h1>太鼓スコア記録 管理者</h1><div class="who"><div id="who"></div><span class="pill tap" id="reload">再読み込み</span></div></header>
<main class="wide"><div id="banners"></div><div id="view"></div></main>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="dan.js"></script>
<script src="dan-admin.js"></script>
<script>
'use strict';
const KEY_LS = 'taikoAdminKey';
let adminKey = '';
try { adminKey = localStorage.getItem(KEY_LS) || ''; } catch (e) {}
let D = null; // { players, songs, records, events, results, photoFolderUrl, version }
const st = { tab: 'rank', rankMode: 'event', rankEvent: '', rankChart: '', detail: null, eventForm: null, evQ: '',
  songForm: null, songQ: '', songGenre: '', songSort: 'title',
  dataPlayer: '', dataQ: '', dataFlag: 'need', backups: null };
const photoCache = new Map();
const TABS = [['rank', '🏆 ランキング'], ['events', '📅 大会'], ['songs', '🎵 楽曲'], ['players', '👤 プレイヤー'], ['data', '🗂 スコアデータ'], ['dan', '🏯 段位道場データ'], ['manage', '⚙ 管理']];

const getSong = id => id && D ? (D.songs.find(s => s.id === id) || null) : null;
const groupMap = () => groupSongs(D.songs);
const pname = id => { const p = D.players.find(x => x.id === id); return p ? (p.name || p.id) : id; };
const recs = () => D.records.filter(r => !r.deleted);
const liveEvents = () => D.events.filter(e => !e.deleted).sort((a, b) => ts(b.start) - ts(a.start));
const newSongId = () => { let id; do { id = 's_' + rand(8).toLowerCase(); } while (D.songs.some(s => s.id === id)); return id; };
/** 要確認の印：写真添付後に編集／プレイ日時と受信時刻が72時間以上離れている／自動計算と不一致 */
const gapHours = r => (ts(r.firstReceivedAt || r.receivedAt) - ts(r.playedAt)) / HOUR_MS;
function flagsOf(r) {
  const f = [];
  if (r.editedAfterPhoto) f.push('<span class="badge b-warn">写真添付後に編集</span>');
  if (gapHours(r) >= GAP_HOURS) f.push(`<span class="badge b-warn">日時ずれ${Math.floor(gapHours(r) / 24)}日</span>`);
  if (r.mismatch) f.push('<span class="badge b-warn">計算不一致</span>');
  return f.join('');
}
const needsCheck = r => r.editedAfterPhoto || gapHours(r) >= GAP_HOURS;

/* ===================== 読み込み ===================== */
async function loadAll() {
  $('#who').textContent = '読み込み中…';
  try {
    D = await api('adminGetAll', { adminKey }, 60000);
    try { localStorage.setItem(KEY_LS, adminKey); } catch (e) {}
    if (!st.rankEvent) { const act = liveEvents().find(eventOpen) || liveEvents()[0]; st.rankEvent = act ? act.id : ''; }
    render();
  } catch (e) {
    if (e.code === 'admin') { adminKey = ''; try { localStorage.removeItem(KEY_LS); } catch (er) {} }
    D = null; render(); toast(e.message, 3000);
  }
}
function render() {
  $('#who').textContent = D ? `プレイヤー${D.players.length}人・記録${recs().length}件` : '';
  $('#banners').innerHTML = !API_URL ? `<div class="banner err">config.js にサーバーURLが設定されていません。</div>`
    : D && serverOutdated(D.version) ? `<div class="banner err">⚠ ${esc(OUTDATED_MSG)}<br>（サーバー：${esc(D.version || '2.0以前')}／必要：${REQUIRED_SERVER}）</div>` : '';
  if (!D) return viewLogin();
  refreshOniBoth(D.songs);
  const need = recs().filter(needsCheck).length;
  $('#view').innerHTML = `<div class="tabs">${TABS.map(([k, l]) => `<button data-tab="${k}" class="${st.tab === k ? 'on' : ''}">${l}${k === 'data' && need ? ` <span class="badge" style="color:#fff;border-color:#fff">${need}</span>` : ''}</button>`).join('')}</div><div id="tabBody"></div>`;
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { st.tab = b.dataset.tab; st.detail = null; render(); window.scrollTo(0, 0); });
  ({ rank: viewRank, events: viewEvents, songs: viewSongs, players: viewPlayers, data: viewData, dan: viewDanData, manage: viewManage })[st.tab]();
}
function viewLogin() {
  $('#view').innerHTML = `<div class="card" style="max-width:480px;margin:40px auto">
    <h2>管理者ログイン</h2>
    <div class="muted">GASで「setup」を実行したときにログへ表示された管理者キーを入力してください。この端末に保存されます。</div>
    <label>管理者キー</label><input id="ak" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(adminKey)}">
    <button class="btn" id="login">ログイン</button></div>`;
  $('#login').onclick = () => { adminKey = $('#ak').value.trim(); if (adminKey) loadAll(); };
}

/* ===================== 共通操作：写真・却下 ===================== */
async function showPhoto(photoId, r) {
  const s = getSong(r.songId);
  const m = showModal(`<h2>${esc(pname(r.playerId))}：${esc(songName(s))}</h2>
    <div class="muted">登録スコア <b>${fmtN(r.score)}</b>（良${r.good}・可${r.ok}・不可${r.bad}・連打${r.roll}）・${fmtDate(r.playedAt)} プレイ</div>
    <div id="ph" class="muted" style="margin-top:10px">写真を読み込んでいます…</div>`, true);
  try {
    let src = photoCache.get(photoId);
    if (!src) { const res = await api('adminGetPhoto', { adminKey, photoId }, 60000); src = `data:${res.mime};base64,${res.data}`; photoCache.set(photoId, src); }
    m.querySelector('#ph').innerHTML = `<img src="${src}" alt="" style="width:100%;border-radius:8px">`;
  } catch (e) { m.querySelector('#ph').textContent = '写真を読み込めませんでした：' + e.message; }
}
/** 却下理由をテンプレートから選ぶ */
function askReject() {
  return new Promise(resolve => {
    const m = showModal(`<h2>記録を却下</h2><div class="muted">ランキングの対象外にします（記録は消えません）。プレイヤーには次に開いたときに理由が通知されます。</div>
      <div style="margin-top:8px">${REJECT_REASONS.map((t, i) => `<label class="chk"><input type="radio" name="rr" value="${esc(t)}"${i === 0 ? ' checked' : ''}> ${esc(t)}</label>`).join('')}
      <label class="chk"><input type="radio" name="rr" value="__other"> その他</label>
      <input id="rrOther" maxlength="100" placeholder="その他の理由（一言）" style="margin-top:6px"></div>
      <button class="btn danger" id="rrOk" style="background:var(--danger);color:#fff">却下する</button>`);
    m.querySelector('#rrOther').onfocus = () => { m.querySelector('input[value="__other"]').checked = true; };
    m.querySelector('#rrOk').onclick = () => {
      let v = m.querySelector('input[name=rr]:checked').value;
      if (v === '__other') v = 'その他：' + (m.querySelector('#rrOther').value.trim() || '（記入なし）');
      m.remove(); resolve(v);
    };
    m.querySelector('[data-close]').addEventListener('click', () => resolve(null));
  });
}
async function setStatus(rid, status) {
  let reason = null;
  if (status === 'rejected') { reason = await askReject(); if (!reason) return; }
  try {
    const res = await api('adminSetStatus', { adminKey, recordId: rid, status, reason });
    const i = D.records.findIndex(x => x.id === rid); if (i >= 0) D.records[i] = res.record;
    D.results.forEach(x => { if (x.recordId === rid) x.status = res.status; });
    toast(status === 'rejected' ? '却下しました' : '却下を取り消しました'); render();
  } catch (e) { toast(e.message, 3000); }
}
function bindRecActions(root) {
  (root || document).querySelectorAll('[data-photo]').forEach(b => b.onclick = () => {
    const r = D.records.find(x => x.id === b.dataset.rid) || D.results.find(x => x.recordId === b.dataset.rid);
    showPhoto(b.dataset.photo, r);
  });
  (root || document).querySelectorAll('[data-status]').forEach(b => b.onclick = () => setStatus(b.dataset.rid, b.dataset.status));
}

/* ===================== ランキング =====================
   「単位」＝順位をつける対象
    譜面単位：1譜面（大会の譜面モード／常設ランキング）
    曲単位　：1曲の基準コースまでの全譜面。コースハンデ・連打補正後の最高スコアで比べる
   確定済みの大会は、受付終了時点でコピーした結果（results）だけで順位をつける */
const inPeriod = (r, ev) => !ev || (ts(r.playedAt) >= ts(ev.start) && ts(r.playedAt) <= ts(ev.end));
const usable = r => !r.deleted && r.score != null && !!r.photoId && r.status !== 'rejected';
const isFinal = ev => !!(ev && ev.finalizedAt);
const snapRecs = (ev, withRemoved) => D.results.filter(x => x.eventId === ev.id && (withRemoved || !x.removed))
  .map(x => ({ ...x, id: x.recordId, deleted: false, mismatch: false, scoreSource: '' }));
function unitsFor(ev) {
  if (!ev) { const s = getSong(st.rankChart); return s ? [{ key: s.id, ids: new Set([s.id]), chart: s, cfg: null, allIds: new Set([s.id]) }] : []; }
  if (isMulti(ev)) return (ev.chartIds || []).map(getSong).filter(Boolean).map(s => ({ key: s.id, ids: new Set([s.id]), chart: s, cfg: null, allIds: new Set([s.id]) }));
  return resolveEventSongs(ev, D.songs).map(x => ({ key: 'g:' + x.cfg.ids[0], ids: x.ids, group: x.group, cfg: x.cfg, above: x.above,
    allIds: new Set(x.group.charts.map(c => c.id)) }));
}
function rankUnit(u, ev) {
  const best = new Map(), plays = new Map(), fin = isFinal(ev);
  let noPhoto = 0, rejected = 0, aboveN = 0;
  for (const r of fin ? snapRecs(ev) : recs()) {
    if (!u.allIds.has(r.songId) || (!fin && !inPeriod(r, ev))) continue;
    if (!u.ids.has(r.songId)) { aboveN++; continue; } // 基準コースより上：保存のみ
    plays.set(r.playerId, (plays.get(r.playerId) || 0) + 1);
    if (r.status === 'rejected') rejected++; else if (!r.photoId) noPhoto++;
    // 確定結果は締切時に確認済み、または管理者が追加したものなので写真の有無は問わない
    if (fin ? (r.score == null || r.status === 'rejected') : !usable(r)) continue;
    const chart = getSong(r.songId); if (!chart) continue;
    const adj = adjScore(r, chart.course, u.cfg);
    const cur = best.get(r.playerId);
    if (!cur || adj > cur.adj || (adj === cur.adj && ts(r.playedAt) < ts(cur.r.playedAt))) best.set(r.playerId, { r, adj, chart });
  }
  const rows = [...best.values()].sort((a, b) => b.adj - a.adj || ts(a.r.playedAt) - ts(b.r.playedAt));
  withRanks(rows, x => x.adj);
  return { rows, plays, noPhoto, rejected, aboveN };
}
/** 同点は同順位（1,1,3…） */
function withRanks(rows, val) { rows.forEach((r, i) => { r._rank = i > 0 && val(rows[i - 1]) === val(r) ? rows[i - 1]._rank : i + 1; }); return rows; }
function rankTotal(ev) {
  const units = unitsFor(ev), tot = new Map();
  units.forEach(u => rankUnit(u, ev).rows.forEach(x => {
    const t = tot.get(x.r.playerId) || { playerId: x.r.playerId, sum: 0, n: 0 };
    t.sum += x.adj; t.n++; tot.set(x.r.playerId, t);
  }));
  const rows = [...tot.values()].sort((a, b) => b.sum - a.sum || b.n - a.n);
  return { rows: withRanks(rows, r => r.sum + '/' + r.n), total: units.length };
}
const unitTitle = u => u.chart
  ? `<span class="cc-${u.chart.course}" style="color:var(--cc)">${esc(cshort(u.chart))}</span> ${esc(u.chart.title)}`
  : esc(u.group.title);
const unitSub = u => u.chart ? esc(lvLabel(u.chart))
  : `基準 ${esc(cname({ course: u.cfg.base, title: u.group.title }))} まで（${[...u.ids].map(getSong).map(c => esc(cshort(c))).join('・')}）・${u.cfg.hcOn ? 'ハンデあり' : 'ハンデなし'}`;
function viewRank() {
  const evs = liveEvents();
  const ev = st.rankMode === 'event' ? D.events.find(e => e.id === st.rankEvent && !e.deleted) : null;
  const chartsWithRecs = [...new Set(recs().filter(r => r.songId).map(r => r.songId))].map(getSong).filter(Boolean).sort(songSort);
  if (st.rankMode === 'all' && !st.rankChart && chartsWithRecs[0]) st.rankChart = chartsWithRecs[0].id;
  let body = '';
  if (st.rankMode === 'event') {
    if (!ev) body = `<div class="card muted">大会がありません。「大会」メニューで作成してください。</div>`;
    else {
      const total = rankTotal(ev), phase = eventState(ev);
      body = `<div class="card"><div class="evrow"><div><h2 style="margin:0">${esc(ev.name)} ${eventBadges(ev)}</h2>
        <div class="muted">${fmtDate(ev.start)} 〜 ${fmtDate(ev.end)}・${isMulti(ev) ? `課題${total.total}譜面` : `課題${total.total}曲（曲単位・補正後スコア）`}</div></div>
        <button class="btn small" data-img="total">総合の画像</button></div>
        ${isFinal(ev) ? `<div class="snapnote">🔒 <b>結果確定済み</b>（${fmtDate(ev.finalizedAt)}）。受付終了時点のランキング対象リザルト ${snapRecs(ev).length}件のコピーで順位をつけています。プレイヤーが記録を編集しても変わりません。修正は申告を受けて、下の表の「修正」「除外」で行ってください。</div>`
          : phase === '受付中' ? `<div class="snapnote">⏳ 大会期間は終了しました。${fmtDate(new Date(eventCloseAt(ev)))} にリザルト受付を締め切り、その時点の結果を確定します。</div>` : ''}
        ${total.total > 1 ? `<h3>総合（課題ごとのランキング対象ベストの合計）</h3>${totalTable(total)}` : ''}</div>` +
        unitsFor(ev).map(u => unitCard(u, ev)).join('');
    }
  } else {
    const us = unitsFor(null);
    body = us.length ? unitCard(us[0], null) : `<div class="card muted">まだ記録がありません。</div>`;
  }
  $('#tabBody').innerHTML = `
  <div class="card">
    <div class="seg" style="margin-top:0">
      <label><input type="radio" name="rm" value="event"${st.rankMode === 'event' ? ' checked' : ''}> 大会ランキング</label>
      <label><input type="radio" name="rm" value="all"${st.rankMode === 'all' ? ' checked' : ''}> 常設ランキング（全期間）</label>
    </div>
    ${st.rankMode === 'event'
      ? `<label>大会</label><select id="evSel">${evs.map(e => `<option value="${e.id}"${e.id === st.rankEvent ? ' selected' : ''}>${esc(e.name)}（${eventState(e)}）</option>`).join('')}</select>`
      : `<label>譜面（記録のある譜面）</label><select id="chSel">${chartsWithRecs.map(s => `<option value="${s.id}"${s.id === st.rankChart ? ' selected' : ''}>${esc(songName(s))} ${esc(lvLabel(s))}</option>`).join('')}</select>`}
    <div class="muted" style="margin-top:8px">ランキング対象＝写真付き・却下されていない記録（大会は期間内のプレイ日時のもの）。各プレイヤーの最高スコアで順位をつけ、同点は同順位です。曲単位の大会は補正後スコアで比べます。</div>
  </div>
  ${body}`;
  document.querySelectorAll('input[name=rm]').forEach(i => i.onchange = () => { st.rankMode = i.value; render(); });
  if ($('#evSel')) $('#evSel').onchange = e => { st.rankEvent = e.target.value; render(); };
  if ($('#chSel')) $('#chSel').onchange = e => { st.rankChart = e.target.value; render(); };
  document.querySelectorAll('[data-detail]').forEach(b => b.onclick = () => { st.detail = st.detail === b.dataset.detail ? null : b.dataset.detail; render(); });
  document.querySelectorAll('[data-img]').forEach(b => b.onclick = () => openImage(b.dataset.img, ev));
  document.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => editResult(ev, b.dataset.fix));
  document.querySelectorAll('[data-excl]').forEach(b => b.onclick = () => saveResult(ev, b.dataset.excl, { removed: b.dataset.v === '1' }));
  document.querySelectorAll('[data-addres]').forEach(b => b.onclick = () => addResult(ev, b.dataset.addres));
  bindRecActions();
}
function totalTable(t) {
  if (!t.rows.length) return '<div class="muted">まだ対象記録がありません。</div>';
  return `<div class="tblwrap"><table class="rank"><tr><th>順位</th><th>プレイヤー</th><th class="n">合計</th><th class="n">提出</th></tr>` +
    t.rows.map(r => `<tr><td class="rk rk${r._rank}">${r._rank}</td><td>${esc(pname(r.playerId))} <span class="muted">@${esc(r.playerId)}</span></td>
      <td class="n"><b>${fmtN(r.sum)}</b></td><td class="n">${r.n}/${t.total}</td></tr>`).join('') + `</table></div>`;
}
const scoreCell = (x, showRaw) => `<b>${fmtN(x.adj)}</b>${showRaw && x.adj !== x.r.score ? `<span class="raw">素点 ${fmtN(x.r.score)}</span>` : ''}` +
  (x.r.mismatch ? '<span class="badge b-warn">計算不一致</span>' : '') + (x.r.scoreSource === 'manual' ? '<span class="badge b-ka">手入力</span>' : '') +
  (x.r.editedAt ? `<span class="badge b-ka" title="${esc(x.r.note || '')}">管理者修正</span>` : '');
function rowActions(r, ev) {
  const fin = isFinal(ev);
  return `<div class="row" style="flex-wrap:nowrap">
    <button class="btn sub small" data-photo="${esc(r.photoId)}" data-rid="${esc(r.id)}">写真</button>
    ${fin ? `<button class="btn sub small" data-fix="${esc(r.id)}">修正</button><button class="btn sub small danger" data-excl="${esc(r.id)}" data-v="1">除外</button>` : ''}
    <button class="btn sub small danger" data-status="rejected" data-rid="${esc(r.id)}">却下</button></div>`;
}
function unitCard(u, ev) {
  const res = rankUnit(u, ev), song = !u.chart;
  return `<div class="card">
    <div class="evrow"><div><h2 style="margin:0">${unitTitle(u)}</h2>
      <div class="muted">${unitSub(u)}・対象${res.rows.length}人・写真なし${res.noPhoto}件・却下${res.rejected}件${res.aboveN ? `・対象外コース${res.aboveN}件` : ''}</div></div>
      <div class="row" style="flex-wrap:nowrap"><button class="btn sub small" data-detail="${esc(u.key)}">${st.detail === u.key ? '全記録を閉じる' : '全記録'}</button><button class="btn small" data-img="${esc(u.key)}">画像</button></div></div>
    ${res.rows.length ? `<div class="tblwrap"><table class="rank"><tr><th>順位</th><th>プレイヤー</th>${song ? '<th>コース</th>' : ''}<th class="n">${song ? '補正後' : 'スコア'}</th><th class="n">良/可/不可/連打</th><th>プレイ日時</th><th class="n">回数</th><th></th></tr>` +
      res.rows.map(x => `<tr><td class="rk rk${x._rank}">${x._rank}</td><td>${esc(pname(x.r.playerId))} <span class="muted">@${esc(x.r.playerId)}</span></td>
        ${song ? `<td class="cc-${x.chart.course}"><b style="color:var(--cc)">${esc(cshort(x.chart))}</b></td>` : ''}
        <td class="n">${scoreCell(x, song)}</td>
        <td class="n"><span class="j-good">${x.r.good}</span>/<span class="j-ok">${x.r.ok}</span>/<span class="j-bad">${x.r.bad}</span>/<span class="j-roll">${x.r.roll}</span></td>
        <td class="muted">${fmtDate(x.r.playedAt)}</td><td class="n">${res.plays.get(x.r.playerId) || 0}</td>
        <td>${rowActions(x.r, ev)}</td></tr>`).join('') +
      `</table></div>` : '<div class="muted">まだランキング対象の記録がありません。</div>'}
    ${st.detail === u.key ? detailTable(u, ev) : ''}
  </div>`;
}
/** 全記録。確定前：期間内の全記録（写真なし・却下・対象外コースも）／確定後：確定結果（除外分も）＋結果に入っていない期間内の記録 */
function detailTable(u, ev) {
  const song = !u.chart, fin = isFinal(ev);
  const head = `<tr><th>プレイヤー</th>${song ? '<th>コース</th>' : ''}<th class="n">スコア</th><th class="n">良/可/不可/連打</th><th>プレイ日時</th><th>状態</th><th></th></tr>`;
  const cells = (r, stateHtml, act) => {

      photoBtn(r) + `<button class="btn sub small" data-fix="${esc(r.id)}">修正</button>` +

    ${outside.length ? `<h3>確定結果に入っていない期間内の記録（${outside.length}件）</h3>
      <div class="muted">写真なし・却下・受付締切後の登録など。申告を受けて結果に加える場合は「結果に追加」を押してください。</div>

        photoBtn(r) + `<button class="btn sub small" data-addres="${esc(r.id)}">結果に追加</button>`)).join('') + `</table></div>` : ''}`;
}

async function saveResult(ev, rid, fields) {

    const res = await api('adminEditResult', Object.assign({ adminKey, eventId: ev.id, recordId: rid }, fields));

async function addResult(ev, rid) {

/* ----- ランキング画像（1920×1080 PNG） ----- */
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif';
function fitText(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text; while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawRanking(o) {
  const W = 1920, H = 1080, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#1c120e'); g.addColorStop(1, '#3a1b12');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = '#d9442b'; x.fillRect(0, 0, W, 14);
  for (let i = 0; i < 6; i++) { x.beginPath(); x.arc(W - 160, 150, 120 + i * 70, 0, Math.PI * 2); x.lineWidth = 2; x.strokeStyle = 'rgba(255,255,255,.05)'; x.stroke(); }
  x.textBaseline = 'alphabetic';
  x.fillStyle = '#fff'; x.font = `800 60px ${FONT}`; x.fillText(fitText(x, o.title, 1500), 80, 108);
  const sy = 176;
  if (o.chart || o.song) {
    let left = 80;
    if (o.chart) {
      const s = o.chart;
      x.font = `800 34px ${FONT}`;
      const cl = cshort(s), cw = x.measureText(cl).width + 40;
      x.fillStyle = COURSE_COLOR[s.course]; roundRect(x, 80, sy - 40, cw, 52, 26); x.fill();
      x.fillStyle = '#fff'; x.fillText(cl, 100, sy - 2);
      left = 80 + cw + 24;
    }
    x.font = `700 42px ${FONT}`; x.fillStyle = '#fff';
    const name = o.chart ? o.chart.title : o.song.title;
    const tl = fitText(x, name, 1150), tw = x.measureText(tl).width;
    x.fillText(tl, left, sy);
    x.font = `600 30px ${FONT}`; x.fillStyle = '#f2c94c';
    x.fillText(fitText(x, o.chart ? lvLabel(o.chart) : o.song.sub, W - 120 - left - tw - 28), left + tw + 28, sy);
  } else if (o.subtitle) { x.font = `600 36px ${FONT}`; x.fillStyle = '#e8dcd3'; x.fillText(fitText(x, o.subtitle, 1700), 80, sy); }
  const rows = o.rows.slice(0, 10), top = 230, rh = 78;
  if (!rows.length) { x.font = `600 40px ${FONT}`; x.fillStyle = '#bba'; x.fillText('ランキング対象の記録はまだありません', 80, 400); }
  rows.forEach((r, i) => {
    const y = top + i * rh, base = y + 50;
    x.fillStyle = i % 2 ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.075)'; roundRect(x, 60, y, W - 120, rh - 10, 14); x.fill();
    x.font = `800 46px ${FONT}`; x.fillStyle = r.rank === 1 ? '#f5c542' : r.rank === 2 ? '#d5dde5' : r.rank === 3 ? '#d99058' : '#fff';
    x.textAlign = 'right'; x.fillText(String(r.rank), 150, base); x.textAlign = 'left';
    x.font = `700 40px ${FONT}`; x.fillStyle = '#fff'; x.fillText(fitText(x, r.name, 760), 190, base);
    if (r.course) {
      x.font = `800 26px ${FONT}`;
      const cw = x.measureText(r.course.label).width + 28;
      x.fillStyle = COURSE_COLOR[r.course.c]; roundRect(x, 980, y + 18, cw, 38, 19); x.fill();
      x.fillStyle = '#fff'; x.fillText(r.course.label, 994, y + 46);
    }
    x.textAlign = 'right';
    x.font = `500 26px ${FONT}`; x.fillStyle = '#cbbfb6'; x.fillText(r.detail || '', 1470, base - 2);
    x.font = `800 48px ${FONT}`; x.fillStyle = '#fff'; x.fillText(r.score, W - 90, base + 2);
    x.textAlign = 'left';
  });
  x.font = `500 22px ${FONT}`; x.fillStyle = 'rgba(255,255,255,.5)'; x.textAlign = 'right';
  x.fillText(o.footer || ('太鼓スコア記録・' + fmtDate(new Date())), W - 70, H - 26); x.textAlign = 'left';
  if (o.rows.length > 10) x.fillText(`ほか${o.rows.length - 10}人`, 80, H - 26);

}
function openImage(key, ev) {

    if (shoko != null && shoko % 10 !== 0 && !confirm('初項は通常10点単位です。このまま保存しますか？')) return;
    const now = isoLocal();
    await saveSongs([{ ...(ed || { id: f.newId || (f.newId = newSongId()), createdAt: now, deleted: false }), title, genre, ...info, course, level, subLevel, maxCombo, shoko, wikiUrl, videoUrl, updatedAt: now }]);
  };
  if ($('#sDel')) $('#sDel').onclick = async () => {
    const s = getSong(f.id);
    if (!confirm(`${songName(s)}を削除しますか？（記録は残ります）`)) return;
    await saveSongs([{ ...s, deleted: true }]);
  };
}
async function saveSongs(list) {
  try {
    const res = await api('adminSaveSongs', { adminKey, songs: list }, 60000);
    res.songs.forEach(s => { const i = D.songs.findIndex(x => x.id === s.id); if (i >= 0) D.songs[i] = s; else D.songs.push(s); });
    if (res.version) D.version = res.version;
    // 送った項目がサーバーで捨てられていないか確認（旧バージョンのデプロイ対策）
    const lost = list.some(s => { const r = res.songs.find(x => x.id === s.id);
      return r && ['wikiUrl', 'videoUrl', 'composer', 'addedDate'].some(k => s[k] && !r[k]); });
    st.songForm = null; render();
    if (res.skipped && res.skipped.length) alert('次の譜面は、同じ曲名・コースがすでに登録されていたため追加しませんでした。\n\n' + res.skipped.join('\n'));
    else if (lost) alert('一部の項目（リンク・作曲者・追加日）がサーバーに保存されませんでした。\n\n' + OUTDATED_MSG);
    else toast(`${res.songs.length}譜面を保存しました`);
  } catch (e) {
    if (e.code === 'dup_song') { alert(e.message + '\n\n画面を最新の状態にします。'); st.songForm = null; await loadAll(); return; }
    toast(e.message, 3000);
  }
}
/** 旧ツールの書き出しファイルなどから楽曲だけを一括登録（同じ曲名・コースは飛ばす） */
async function importSongs(text) {
  let o; try { o = JSON.parse(text); } catch (e) { alert('読み込めないファイルです。'); return; }
  const arr = Array.isArray(o) ? o : (o && Array.isArray(o.songs) ? o.songs : []);
  const key = s => String(s.title || '').trim() + '\u0000' + s.course;
  const have = new Set(D.songs.filter(s => !s.deleted).map(key));
  const add = [];
  arr.forEach(s => {
    if (!s || !s.title || s.deleted || !COURSES[s.course] || have.has(key(s))) return;
    have.add(key(s));
    const id = /^s_[A-Za-z0-9_-]{2,40}$/.test(s.id || '') && !D.songs.some(x => x.id === s.id) ? s.id : newSongId();
    add.push({ id, title: String(s.title).trim(), genre: s.genre || '', composer: s.composer || '', addedDate: s.addedDate || '',
      course: s.course, level: s.level, subLevel: s.subLevel || null, maxCombo: s.maxCombo ?? null, shoko: s.shoko ?? null,
      wikiUrl: s.wikiUrl || '', videoUrl: s.videoUrl || '', createdAt: isoLocal(), updatedAt: isoLocal(), deleted: false });
  });
  if (!add.length) { alert('新しく追加できる譜面はありませんでした。'); return; }
  if (!confirm(`${add.length}譜面を追加します。よろしいですか？`)) return;
  await saveSongs(add);
}

/* ===================== プレイヤー ===================== */
function viewPlayers() {
  const byDev = new Map();
  D.players.forEach(p => { if (!p.deviceId) return; byDev.set(p.deviceId, [...(byDev.get(p.deviceId) || []), p.id]); });
  const dups = [...byDev.values()].filter(a => a.length > 1);
  const stat = new Map();
  recs().forEach(r => {
    const s = stat.get(r.playerId) || { n: 0, photo: 0, last: 0, need: 0 };
    s.n++; if (r.photoId && r.status !== 'rejected') s.photo++; if (needsCheck(r)) s.need++;
    s.last = Math.max(s.last, ts(r.playedAt)); stat.set(r.playerId, s);
  });
  const ps = [...D.players].sort((a, b) => (stat.get(b.id)?.last || 0) - (stat.get(a.id)?.last || 0));
  $('#tabBody').innerHTML = `
  ${dups.length ? `<div class="card" style="border-color:var(--warn)"><h2 style="color:var(--warn)">⚠ 同じ端末で複数のIDが登録されています</h2>
    ${dups.map(a => `<div>${a.map(id => `@${esc(id)}`).join('、')}</div>`).join('')}
    <div class="muted">家族や友人と端末を共有している場合もあるため、警告のみです。</div></div>` : ''}
  <div class="card"><h2>プレイヤー（${D.players.length}人）</h2>
    <div class="tblwrap"><table class="rank"><tr><th>ID</th><th>表示名</th><th class="n">記録</th><th class="n">写真付き</th><th class="n">要確認</th><th>最終プレイ</th><th>端末ID</th><th></th></tr>
    ${ps.map(p => { const s = stat.get(p.id) || { n: 0, photo: 0, last: 0, need: 0 }; const dup = (byDev.get(p.deviceId) || []).length > 1;
      return `<tr><td>@${esc(p.id)}</td><td>${esc(p.name)}</td><td class="n">${s.n}</td><td class="n">${s.photo}</td>
      <td class="n">${s.need ? `<button class="btn sub small" data-pcheck="${esc(p.id)}">${s.need}件</button>` : '0'}</td>
      <td class="muted">${s.last ? fmtDate(new Date(s.last)) : '-'}</td>
      <td class="muted">${esc(p.deviceId || '-')}${dup ? '<span class="badge b-warn">重複</span>' : ''}</td>
      <td>${p.registered ? `<button class="btn sub small" data-reset="${esc(p.id)}">引き継ぎリセット</button>` : '<span class="badge b-warn">再登録待ち</span>'}</td></tr>`; }).join('')}
    </table></div>
    <div class="muted" style="margin-top:8px">「引き継ぎリセット」は、プレイヤーが引き継ぎコードを失くしたときに使います。リセット後、本人が同じIDで登録し直すと、過去の記録も引き継げます。</div>
  </div>`;
  document.querySelectorAll('[data-pcheck]').forEach(b => b.onclick = () => { st.tab = 'data'; st.dataPlayer = b.dataset.pcheck; st.dataFlag = 'need'; render(); });
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
    const id = b.dataset.reset;
    if (!confirm(`@${id} の引き継ぎコードを無効にします。\n本人が同じIDで登録し直すまで、その端末からは送信できなくなります。よろしいですか？`)) return;
    try { await api('adminResetPlayer', { adminKey, playerId: id }); const p = D.players.find(x => x.id === id); if (p) p.registered = false; toast('リセットしました'); render(); }
    catch (e) { toast(e.message, 3000); }
  });
}

/* ===================== スコアデータ =====================
   全記録の確認。要確認（写真添付後の編集・日時ずれ）、却下、削除済み（復元・完全削除）など */
const DATA_FLAGS = {
  need: '要確認（写真添付後に編集・日時ずれ）', all: 'すべての記録', edit: '写真添付後に編集', gap: `日時ずれ（${GAP_HOURS}時間以上）`,
  mismatch: '自動計算と不一致', rejected: '却下', nophoto: '写真なし', deleted: '削除済み'
};
function viewData() {
  const all = D.records;
  const t = st.dataQ.trim().toLowerCase();
  const pass = r => {
    if (st.dataPlayer && r.playerId !== st.dataPlayer) return false;
    if (t) { const s = getSong(r.songId); if (!(s ? s.title : '楽曲未選択').toLowerCase().includes(t)) return false; }
    switch (st.dataFlag) {
      case 'need': return !r.deleted && needsCheck(r);
      case 'edit': return !r.deleted && r.editedAfterPhoto;
      case 'gap': return !r.deleted && gapHours(r) >= GAP_HOURS;
      case 'mismatch': return !r.deleted && r.mismatch;
      case 'rejected': return !r.deleted && r.status === 'rejected';
      case 'nophoto': return !r.deleted && !r.photoId;
      case 'deleted': return r.deleted;
      default: return !r.deleted;
    }
  };
  const list = all.filter(pass).sort((a, b) => ts(b.receivedAt) - ts(a.receivedAt));
  const cnt = k => all.filter(r => { const o = st.dataFlag; st.dataFlag = k; const v = pass(r); st.dataFlag = o; return v; }).length;
  const restoreLeftDays = r => Math.ceil((RESTORE_DAYS * DAY_MS - (Date.now() - ts(r.deletedAt || r.updatedAt))) / DAY_MS);
  $('#tabBody').innerHTML = `
  <div class="card"><h2>スコアデータ</h2>
    <div class="filters">
      <select id="dFlag">${Object.entries(DATA_FLAGS).map(([k, v]) => `<option value="${k}"${st.dataFlag === k ? ' selected' : ''}>${v}（${cnt(k)}）</option>`).join('')}</select>
      <select id="dPlayer"><option value="">すべてのプレイヤー</option>${D.players.map(p => `<option value="${esc(p.id)}"${st.dataPlayer === p.id ? ' selected' : ''}>${esc(p.name)} @${esc(p.id)}</option>`).join('')}</select>
      <input id="dQ" type="search" placeholder="曲名で絞り込み" value="${esc(st.dataQ)}">
    </div>
    <div class="muted" style="margin-top:8px">「日時ずれ」は、プレイ日時とサーバーが最初に受け取った時刻が${GAP_HOURS}時間以上離れている記録です（電波の都合で送信が遅れた場合も含みます）。削除済みの記録は、削除から${RESTORE_DAYS}日まではプレイヤーが自分で復元できます。</div>
  </div>
  <div class="card"><h2>${esc(DATA_FLAGS[st.dataFlag])}（${list.length}件${list.length > 300 ? '・新しい300件を表示' : ''}）</h2>
    ${list.length ? `<div class="tblwrap"><table class="rank"><tr><th>受信</th><th>プレイヤー</th><th>譜面</th><th class="n">スコア</th><th class="n">良/可/不可/連打</th><th>プレイ日時</th><th>状態</th><th></th></tr>
    ${list.slice(0, 300).map(r => { const s = getSong(r.songId);
      const stHtml = (r.deleted ? `<span class="badge b-mute">削除 ${fmtDay(r.deletedAt || r.updatedAt)}</span>${restoreLeftDays(r) > 0 ? `<span class="raw">本人が復元可（あと${restoreLeftDays(r)}日）</span>` : ''}`
        : r.status === 'rejected' ? `<span class="badge b-ng">却下</span><span class="raw">${esc(r.rejectReason)}</span>` : r.photoId ? '<span class="badge b-ok">写真あり</span>' : '<span class="badge b-mute">写真なし</span>') + flagsOf(r);
      const act = r.deleted
        ? `<button class="btn sub small" data-restore="${esc(r.id)}">復元</button><button class="btn sub small danger" data-purge="${esc(r.id)}">完全削除</button>`
        : (r.photoId ? `<button class="btn sub small" data-photo="${esc(r.photoId)}" data-rid="${esc(r.id)}">写真</button>` : '') +
          (r.status === 'rejected' ? `<button class="btn sub small" data-status="ok" data-rid="${esc(r.id)}">却下を取消</button>` : `<button class="btn sub small danger" data-status="rejected" data-rid="${esc(r.id)}">却下</button>`);
      return `<tr class="${r.deleted ? 'rej' : ''}"><td class="muted">${fmtDay(r.receivedAt)}</td><td>${esc(pname(r.playerId))}</td>
        <td>${s ? `<span class="cc-${s.course}" style="color:var(--cc);font-weight:700">${esc(cshort(s))}</span> ${esc(s.title)}` : '楽曲未選択'}</td>
        <td class="n"><b>${fmtN(r.score)}</b></td><td class="n">${r.good}/${r.ok}/${r.bad}/${r.roll}</td><td class="muted">${fmtDate(r.playedAt)}</td>
        <td>${stHtml}</td><td><div class="row" style="flex-wrap:nowrap">${act}</div></td></tr>`; }).join('')}
    </table></div>` : '<div class="muted">該当する記録はありません。</div>'}
  </div>`;
  $('#dFlag').onchange = e => { st.dataFlag = e.target.value; render(); };
  $('#dPlayer').onchange = e => { st.dataPlayer = e.target.value; render(); };
  $('#dQ').onchange = e => { st.dataQ = e.target.value; render(); };
  bindRecActions();
  document.querySelectorAll('[data-restore]').forEach(b => b.onclick = async () => {
    try { const res = await api('adminRestoreRecord', { adminKey, recordId: b.dataset.restore });
      const i = D.records.findIndex(x => x.id === res.record.id); if (i >= 0) D.records[i] = res.record; toast('復元しました'); render(); }
    catch (e) { toast(e.message, 3000); }
  });
  document.querySelectorAll('[data-purge]').forEach(b => b.onclick = async () => {
    if (!confirm('この記録を完全に削除します。写真も削除され、元に戻せません（確定済みの大会結果のコピーは残ります）。よろしいですか？')) return;
    try { await api('adminPurgeRecord', { adminKey, recordId: b.dataset.purge });
      D.records = D.records.filter(x => x.id !== b.dataset.purge); toast('完全に削除しました'); render(); }
    catch (e) { toast(e.message, 3000); }
  });
}

/* ===================== 管理 ===================== */
function viewManage() {
  const bk = st.backups;
  $('#tabBody').innerHTML = `
  <div class="card"><h2>サーバー</h2>
    <div class="kv"><span>サーバーのバージョン</span><span>${esc(D.version || '2.0以前')}${serverOutdated(D.version) ? ' <span class="badge b-ng">更新が必要</span>' : ' <span class="badge b-ok">最新</span>'}</span>
      <span>必要なバージョン</span><span>${REQUIRED_SERVER}</span>
      <span>記録</span><span>${D.records.length}件（うち削除済み ${D.records.filter(r => r.deleted).length}件）</span>
      <span>確定済みの大会結果</span><span>${D.results.length}件</span></div>
  </div>
  <div class="card"><h2>バックアップ</h2>
    <div class="muted">スプレッドシート全体（記録・楽曲・大会・確定結果）をドライブの「太鼓スコア記録_バックアップ」フォルダに複製します。写真は容量が大きいため含みません（写真フォルダがそのまま残ります）。</div>
    <div class="row" style="margin-top:10px">
      <button class="btn small" id="bkNow">今すぐバックアップ</button>
      <button class="btn sub small" id="bkJson">全データをJSONでダウンロード</button>
      <a class="btn sub small" href="${esc(D.photoFolderUrl)}" target="_blank" rel="noopener" style="text-decoration:none">写真フォルダを開く</a>
    </div>
    <h3>自動バックアップ</h3>
    ${bk ? `<label class="chk"><input type="checkbox" id="bkAuto"${bk.auto ? ' checked' : ''}> 毎週月曜 4時に自動でバックアップする（直近8回分を保存）</label>
      <h3>保存済み（${bk.backups.length}件）</h3>
      ${bk.backups.length ? `<div class="list">${bk.backups.slice(0, 20).map(b => `<div class="item"><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.name)}</a>
        <span class="badge ${b.auto ? 'b-mute' : 'b-ka'}">${b.auto ? '自動' : '手動'}</span></div>`).join('')}</div>` : '<div class="muted">まだありません。</div>'}`
      : '<div class="muted">読み込み中…</div>'}
  </div>
  <div class="card"><h2>この端末</h2>
    <div class="muted">管理者キーはこの端末に保存されています。共有のPCで使った場合はログアウトしてください。</div>
    <button class="btn sub small" id="logout" style="margin-top:8px">ログアウト</button></div>`;
  if (!bk) api('adminBackups', { adminKey }).then(r => { st.backups = r; if (st.tab === 'manage') render(); }).catch(e => toast(e.message, 3000));
  else $('#bkAuto').onchange = async e => {
    try { const r = await api('adminSetAutoBackup', { adminKey, on: e.target.checked }); st.backups.auto = r.auto; toast(r.auto ? '自動バックアップを有効にしました' : '自動バックアップを止めました'); render(); }
    catch (er) { toast(er.message, 3000); }
  };
  $('#bkNow').onclick = async () => {
    $('#bkNow').disabled = true; $('#bkNow').textContent = 'バックアップ中…';
    try { const r = await api('adminBackupNow', { adminKey }, 120000); toast('バックアップしました：' + r.backup.name, 3000); st.backups = null; render(); }
    catch (e) { toast(e.message, 3000); render(); }
  };
  $('#bkJson').onclick = () => download(`taiko_all_${ymd(new Date())}.json`, JSON.stringify({ app: APP, schema: SCHEMA, kind: 'admin-backup', exportedAt: isoLocal(),
    players: D.players, songs: D.songs, records: D.records, events: D.events, results: D.results }, null, 2));
  $('#logout').onclick = () => {
    if (!confirm('ログアウトしますか？（この端末から管理者キーを消します）')) return;
    try { localStorage.removeItem(KEY_LS); } catch (e) {}
    adminKey = ''; D = null; st.backups = null; render();
  };
}

/* ===================== 起動 ===================== */
$('#reload').onclick = () => { if (adminKey) { st.backups = null; loadAll(); } };
if (adminKey && API_URL) loadAll(); else render();
</script>
